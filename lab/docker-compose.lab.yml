# Laboratório de detecção (§26).
#
# Vive separado de `docker-compose.yml` de propósito: a plataforma tem de poder
# correr sem o laboratório, e o laboratório tem de poder ser desligado sem
# derrubar a base de dados. Um analista que só quer ver a interface não precisa
# de ter um gestor Wazuh a consumir 2 GB de memória.
#
# **O que este laboratório deliberadamente NÃO tem:** o Wazuh Indexer e o Wazuh
# Dashboard. Não é omissão por economia — é a tese do trabalho. O Wazuh serve
# aqui como camada de detecção; quem organiza, investiga e responde é a SHEISA.
# Levantar o dashboard do Wazuh ao lado seria montar duas interfaces a competir
# pelo mesmo papel, e triplicaria os recursos necessários.
#
# Arranque:
#   docker compose -f lab/docker-compose.lab.yml up -d --build
#
# A chave de ingestão tem de existir antes (ver lab/README.md).

name: sheisa-lab

services:
  # ------------------------------------------------------------------ gestor
  wazuh-manager:
    image: wazuh/wazuh-manager:4.12.0
    container_name: sheisa-wazuh-manager
    hostname: wazuh-manager-lab
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    environment:
      # Sem indexer no laboratório: desligar o envio evita que o `wazuh-modulesd`
      # tente ligar-se a um serviço que não existe e encha o log de erros.
      INDEXER_URL: ""
      INDEXER_USERNAME: ""
      INDEXER_PASSWORD: ""
      FILEBEAT_SSL_VERIFICATION_MODE: none
      SSL_CERTIFICATE_AUTHORITIES: ""
      SSL_CERTIFICATE: ""
      SSL_KEY: ""
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:-SheisaLab2026!}
    ports:
      # 1514/1515 são as portas dos agentes; 55000 é a API do Wazuh.
      # Expostas apenas em loopback: um gestor Wazuh alcançável a partir da
      # rede é um alvo, não uma conveniência.
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
      - "127.0.0.1:55000:55000"
    volumes:
      # A configuração que acrescenta o bloco <integration> e o ficheiro que o
      # gerador de alertas escreve.
      - ./config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      # O integrador. É montado em `/wazuh-config-mount/` porque a imagem copia
      # o que está aí para dentro de `/var/ossec/` no arranque, aplicando as
      # permissões correctas — montar directamente em `/var/ossec/integrations`
      # a partir do Windows dá ficheiros que o `integrator` recusa executar.
      - ./integrations/custom-sheisa:/wazuh-config-mount/integrations/custom-sheisa:ro
      - ./integrations/custom-sheisa.py:/wazuh-config-mount/integrations/custom-sheisa.py:ro
      # Registos que o gerador alimenta e que o gestor vigia.
      - lab-logs:/var/log/lab
      - lab-manager-etc:/var/ossec/etc
      - lab-manager-logs:/var/ossec/logs
      - lab-manager-queue:/var/ossec/queue
    extra_hosts:
      # Como a plataforma corre no anfitrião e não em Docker, o integrador
      # precisa de um nome para lá chegar. No Docker Desktop
      # `host.docker.internal` já existe; em Linux esta linha cria-o.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ------------------------------------------------------------------ agente
  # Não existe imagem oficial `wazuh/wazuh-agent`, pelo que o agente é
  # construído a partir do repositório de pacotes da Wazuh. Ver lab/agente/.
  wazuh-agent:
    build:
      context: ./agente
      args:
        WAZUH_VERSION: "4.12.0-1"
    container_name: sheisa-wazuh-agent
    hostname: srv-web-lab
    restart: unless-stopped
    depends_on:
      wazuh-manager:
        condition: service_healthy
    environment:
      WAZUH_MANAGER: wazuh-manager
      WAZUH_AGENT_NAME: srv-web-lab
    volumes:
      # O agente vigia o mesmo ficheiro que o gerador alimenta, o que permite
      # demonstrar a cadeia completa: linha no log → agente → gestor →
      # integrador → SHEISA.
      - lab-logs:/var/log/lab
    cap_add:
      - SYS_PTRACE

  # ------------------------------------------------- alvo do laboratório
  # O que a máquina Kali ataca. Um nginx a servir uma página com alguma
  # superfície (um formulário de acesso, caminhos plausíveis) para que
  # ferramentas de reconhecimento e exploração tenham onde bater.
  #
  # Expõe a 8080 do anfitrião: é para aqui que a VM Kali dispara
  # (`http://<ip-do-anfitrião>:8080`). O Suricata partilha o stack de rede
  # deste contentor, pelo que vê todo o tráfego que lhe chega.
  alvo:
    image: nginx:alpine
    container_name: sheisa-lab-alvo
    hostname: alvo-web-lab
    restart: unless-stopped
    volumes:
      - ./alvo/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8080:80"

  # ------------------------------------------------- sensor Suricata
  # Partilha o stack de rede do alvo (`network_mode: service:alvo`): assim
  # captura na interface por onde o tráfego chega ao alvo, sem precisar de ver
  # a interface física do anfitrião — que num Docker Desktop não é alcançável a
  # partir de um contentor. É o desenho validado antes de o escrever.
  suricata:
    image: jasonish/suricata:latest
    container_name: sheisa-lab-suricata
    restart: unless-stopped
    depends_on:
      - alvo
    network_mode: "service:alvo"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/local.rules:/etc/suricata/rules/local.rules:ro
      - ./suricata/entrada.sh:/entrada.sh:ro
      - lab-suricata-logs:/var/log/suricata
      - lab-suricata-rules:/var/lib/suricata/rules
    entrypoint: ["/bin/sh", "/entrada.sh"]

  # ------------------------------------------------- integrador do Suricata
  # Segue o eve.json que o sensor escreve e entrega os alertas à plataforma.
  # É o equivalente Suricata do `custom-sheisa` do Wazuh — a diferença é que o
  # Suricata escreve um fluxo contínuo em vez de invocar um script por evento.
  suricata-integrador:
    image: python:3.12-alpine
    container_name: sheisa-lab-suricata-integrador
    restart: unless-stopped
    depends_on:
      - suricata
    env_file:
      # Escrito por lab/preparar.sh; contém SHEISA_SURICATA_KEY. Ignorado pelo
      # git, como a chave do Wazuh.
      - ./suricata/ingestao.env
    environment:
      SHEISA_HOOK_URL: "http://host.docker.internal:8099/api/ingest/suricata"
      SHEISA_API_KEY: "${SHEISA_SURICATA_KEY}"
      EVE_PATH: /var/log/suricata/eve.json
    volumes:
      - ./integrations/suricata-sheisa.py:/suricata-sheisa.py:ro
      - lab-suricata-logs:/var/log/suricata:ro
      - lab-suricata-posicao:/var/lib/suricata-integrador
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python3", "/suricata-sheisa.py"]

volumes:
  lab-logs:
  lab-manager-etc:
  lab-manager-logs:
  lab-manager-queue:
  lab-suricata-logs:
  lab-suricata-rules:
  lab-suricata-posicao:
