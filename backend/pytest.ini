[pytest]
# A suite corre sempre contra a base de dados de teste (:15434, tmpfs).
# `conftest.py` fixa SHEISA_ENVIRONMENT=test antes de importar a aplicacao.
testpaths = tests
asyncio_mode = auto
# Fixtures assincronas no mesmo ciclo de eventos do teste que as pede. Uma
# ligacao asyncpg pertence ao ciclo onde foi aberta; parti-los faria as
# fixtures falhar com "attached to a different loop". A preparacao de sessao
# (migracao + semente) e sincrona de proposito, ver tests/conftest.py.
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
